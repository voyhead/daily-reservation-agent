name: Daily Reservation Agent

on:
  workflow_dispatch:
  schedule:
    # GitHub cron runs in UTC.
    # During Dublin daylight saving time, 07:17 UTC is 08:17 Europe/Dublin.
    - cron: "17 7 * * *"

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check Europe/Dublin schedule window
        id: schedule_check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dublin_hour="$(TZ=Europe/Dublin date +%H)"

          case "$dublin_hour" in
            07|08|09|10)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "It is outside the 07:00-10:59 Europe/Dublin schedule window; skipping this scheduled run."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out repository
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run reservation briefing
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python daily_reservation_agent.py
